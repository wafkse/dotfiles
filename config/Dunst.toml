# ==============================================================================
# DUNST APP CONFIGURATION (Put in default profile)
# ==============================================================================
[default.Dunst.global]
font = "JetBrainsMono Nerd Font 10"
width = 300
height = "(0, 300)"
origin = "top-right"
offset = "(20, 20)"
progress_bar = true
progress_bar_height = 10
progress_bar_frame_width = 1
progress_bar_min_width = 150
progress_bar_max_width = 300
corner_radius = 12
padding = 15
horizontal_padding = 15
frame_width = 2
gap_size = 8
separator_height = 2
sort = true
idle_threshold = 120
markup = "full"
format = "<b>%s</b>\n%b"
alignment = "left"
show_age_threshold = 60
word_wrap = true
ignore_newline = false
stack_duplicates = true
hide_duplicate_count = false
show_indicators = true
icon_position = "left"
min_icon_size = 32
max_icon_size = 64

[default.Dunst.urgency_low]
timeout = 3

[default.Dunst.urgency_normal]
timeout = 5

[default.Dunst.urgency_critical]
timeout = 0  # 0 means it will not expire until manually dismissed
