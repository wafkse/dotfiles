[default.Sway.Keybinds.'$mod+Ctrl+1']
command = "move container to workspace number 1"

[default.Sway.Keybinds.'$mod+Ctrl+2']
command = "move container to workspace number 2"

[default.Sway.Keybinds.'$mod+Ctrl+3']
