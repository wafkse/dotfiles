[default.Sway.Keybinds.'$mod+1']
command = "workspace number 1"

[default.Sway.Keybinds.'$mod+2']
command = "workspace number 2"

[default.Sway.Keybinds.'$mod+3']
command = "workspace number 3"

[default.Sway.Keybinds.'$mod+4']
command = "workspace number 4"

[default.Sway.Keybinds.'$mod+5']
command = "workspace number 5"

[default.Sway.Keybinds.'$mod+6']
command = "workspace number 6"

[default.Sway.Keybinds.'$mod+7']
command = "workspace number 7"

[default.Sway.Keybinds.'$mod+8']
command = "workspace number 8"

[default.Sway.Keybinds.'$mod+9']
