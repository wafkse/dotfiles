# Sizing (Niri's set-column-width / set-window-height)
[default.Sway.Keybinds.'$mod+minus']
command = "resize shrink width 10 ppt"

[default.Sway.Keybinds.'$mod+equal']
command = "resize grow width 10 ppt"

[default.Sway.Keybinds.'$mod+Shift+minus']
command = "resize shrink height 10 ppt"

[default.Sway.Keybinds.'$mod+Shift+equal']
command = "resize grow height 10 ppt"

# Maximize / Fullscreen
[default.Sway.Keybinds.'$mod+f']
command = "fullscreen toggle"

[default.Sway.Keybinds.'$mod+Shift+f']
command = "fullscreen toggle global"

# Layout Toggles
[default.Sway.Keybinds.'$mod+space']
command = "floating toggle"

[default.Sway.Keybinds.'$mod+Shift+space']
command = "focus mode_toggle"

[default.Sway.Keybinds.'$mod+w']
command = "layout toggle tabbed split"

# System Binds
[default.Sway.Keybinds.'Print']
spawn_sh = "grim -g \"$(slurp)\" ~/media/pictures/screenshot-$(date +%Y-%m-%d_%H-%M-%S).png"

[default.Sway.Keybinds.'Ctrl+Print']
spawn_sh = "grim ~/media/pictures/screenshot-$(date +%Y-%m-%d_%H-%M-%S).png"

[default.Sway.Keybinds.'Mod1+Print']
spawn_sh = "grim -g \"$(swaymsg -t get_tree | jq -j '.. | select(.focused?) | .rect | \\\"\\(.x),\\(.y) \\(.width)x\\(.height)\\\"')\" ~/media/pictures/screenshot-$(date +%Y-%m-%d_%H-%M-%S).png"

[default.Sway.Keybinds.'$mod+Shift+e']
spawn_sh = "swaynag -t warning -m 'Exit Sway?' -B 'Yes, exit' 'swaymsg exit'"

[default.Sway.Keybinds.'Ctrl+Mod1+Delete']
spawn_sh = "swaynag -t warning -m 'Exit Sway?' -B 'Yes, exit' 'swaymsg exit'"

[default.Sway.Keybinds.'$mod+Shift+p']
command = "output * power toggle"
