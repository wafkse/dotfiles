# spawn-sh = "wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.02+"

# [default.Niri.Keybinds.'Mod+TouchpadScrollUp']
# spawn-sh = "wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.02-"

# Workspace Indexing
[default.Niri.Keybinds.'Mod+1']
focus-workspace = 1

[default.Niri.Keybinds.'Mod+2']
focus-workspace = 2

[default.Niri.Keybinds.'Mod+3']
focus-workspace = 3

[default.Niri.Keybinds.'Mod+4']
focus-workspace = 4

[default.Niri.Keybinds.'Mod+5']
focus-workspace = 5

[default.Niri.Keybinds.'Mod+6']
focus-workspace = 6

[default.Niri.Keybinds.'Mod+7']
focus-workspace = 7

[default.Niri.Keybinds.'Mod+8']
focus-workspace = 8

[default.Niri.Keybinds.'Mod+9']
focus-workspace = 9

[default.Niri.Keybinds.'Mod+Ctrl+1']
move-column-to-workspace = 1

# move-window-to-workspace = 1
[default.Niri.Keybinds.'Mod+Ctrl+2']
move-column-to-workspace = 2

[default.Niri.Keybinds.'Mod+Ctrl+3']
move-column-to-workspace = 3

[default.Niri.Keybinds.'Mod+Ctrl+4']
move-column-to-workspace = 4

[default.Niri.Keybinds.'Mod+Ctrl+5']
move-column-to-workspace = 5

[default.Niri.Keybinds.'Mod+Ctrl+6']
move-column-to-workspace = 6

[default.Niri.Keybinds.'Mod+Ctrl+7']
move-column-to-workspace = 7

[default.Niri.Keybinds.'Mod+Ctrl+8']
move-column-to-workspace = 8

[default.Niri.Keybinds.'Mod+Ctrl+9']
move-column-to-workspace = 9

# [default.Niri.Keybinds.'Mod+Tab']
# focus-workspace-previous = true

# Consuming/Expelling
[default.Niri.Keybinds.'Mod+BracketLeft']
consume-or-expel-window-left = true

[default.Niri.Keybinds.'Mod+BracketRight']
consume-or-expel-window-right = true

[default.Niri.Keybinds.'Mod+Comma']
consume-window-into-column = true

[default.Niri.Keybinds.'Mod+Period']
expel-window-from-column = true

# Presets and Layout Sizing
[default.Niri.Keybinds.'Mod+R']
switch-preset-column-width = true

[default.Niri.Keybinds.'Mod+Shift+R']
switch-preset-column-width-back = true

[default.Niri.Keybinds.'Mod+Ctrl+Shift+R']
switch-preset-window-height = true

[default.Niri.Keybinds.'Mod+Ctrl+R']
reset-window-height = true

[default.Niri.Keybinds.'Mod+F']
maximize-column = true

[default.Niri.Keybinds.'Mod+Shift+F']
fullscreen-window = true

[default.Niri.Keybinds.'Mod+M']
maximize-window-to-edges = true

[default.Niri.Keybinds.'Mod+Ctrl+F']
expand-column-to-available-width = true

[default.Niri.Keybinds.'Mod+C']
center-column = true

[default.Niri.Keybinds.'Mod+Ctrl+C']
center-visible-columns = true

# Fine Adjustments
[default.Niri.Keybinds.'Mod+Minus']
set-column-width = "-10%"

[default.Niri.Keybinds.'Mod+Equal']
set-column-width = "+10%"

[default.Niri.Keybinds.'Mod+Shift+Minus']
set-window-height = "-10%"

[default.Niri.Keybinds.'Mod+Shift+Equal']
set-window-height = "+10%"

# Layout Toggles
[default.Niri.Keybinds.'Mod+Space']
toggle-window-floating = true

[default.Niri.Keybinds.'Mod+Shift+Space']
switch-focus-between-floating-and-tiling = true

[default.Niri.Keybinds.'Mod+W']
toggle-column-tabbed-display = true

# [default.Niri.Keybinds.'Mod+Space']
# switch-layout = "next"

# [default.Niri.Keybinds.'Mod+Shift+Space']
# switch-layout = "prev"

# System Binds
[default.Niri.Keybinds.'Print']
screenshot = true

[default.Niri.Keybinds.'Ctrl+Print']
screenshot-screen = true

[default.Niri.Keybinds.'Alt+Print']
screenshot-window = true

[default.Niri.Keybinds.'Mod+Escape']
allow-inhibiting = false
toggle-keyboard-shortcuts-inhibit = true

[default.Niri.Keybinds.'Mod+Shift+E']
quit = true

[default.Niri.Keybinds.'Ctrl+Alt+Delete']
quit = true

[default.Niri.Keybinds.'Mod+Shift+P']
power-off-monitors = true
