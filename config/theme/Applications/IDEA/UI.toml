#:schema ../../../schema/Universe.toml.schema.json

# tombi: lint.rules.table-key-required.disabled = true
[default.Theme]


# IDEA UI, editor scheme, and icon assignments follow the full theme structure.
[default.Theme.ApplicationRoles.IDEA.UI]
"*.background" = "background"
"*.borderColor" = "background"
