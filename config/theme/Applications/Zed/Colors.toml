#:schema ../../../schema/Universe.toml.schema.json

# tombi: lint.rules.table-key-required.disabled = true
[default.Theme]


[default.Theme.ApplicationRoles.Zed.Colors]
background = { role = "background", mix = "surface-raised", amount = 0.55 }
border = "surface-raised"
"border.variant" = { role = "surface-raised", mix = "background", amount = 0.8 }
"border.focused" = "foreground"
"border.selected" = "accent-primary"
"border.disabled" = "placeholder"
"elevated_surface.background" = "surface"
"surface.background" = "surface"
"element.background" = { role = "surface-dark", mix = "surface", "light-amount" = 0, "dark-amount" = 1 }
"element.hover" = "surface-raised"
"element.active" = { role = "surface-light", opacity = 0.3 }
"element.selected" = { role = "surface-raised", opacity = 0.3 }
"element.disabled" = "placeholder"
"ghost_element.background" = { role = "background", opacity = 0 }
"ghost_element.hover" = { role = "surface-mid", opacity = 0.3 }
"ghost_element.active" = { role = "surface-light", opacity = 0.6 }
"ghost_element.selected" = { role = "surface-mid", mix = "foreground-faint", amount = 0.6, "light-opacity" = 0.35, "dark-opacity" = 0.4 }
"ghost_element.disabled" = "placeholder"
text = "foreground"
"text.muted" = "foreground-subtle"
"text.placeholder" = "placeholder"
"text.disabled" = "placeholder"
"text.accent" = "accent-primary"
icon = "foreground"
"icon.muted" = "foreground-faint"
"icon.disabled" = "placeholder"
"icon.placeholder" = "surface-light"
"icon.accent" = "accent-primary"
"status_bar.background" = "surface-dark"
"title_bar.background" = "surface-dark"
"title_bar.inactive_background" = { role = "surface-dark", mix = "surface", amount = 0.1 }
"toolbar.background" = "background"
"tab_bar.background" = "surface-dark"
"tab.inactive_background" = { role = "surface-dark", shade = -0.02 }
"tab.active_background" = "background"
"panel.background" = "surface"
"panel.focused_border" = "foreground"
"pane.focused_border" = "foreground"
"scrollbar.thumb.background" = { role = "border-strong", opacity = 0.5 }
"scrollbar.thumb.hover_background" = "placeholder"
"scrollbar.thumb.border" = "border"
"scrollbar.track.background" = "surface-dark"
"scrollbar.track.border" = { role = "foreground", opacity = 0.07 }
"editor.foreground" = "foreground"
"editor.background" = "background"
"editor.gutter.background" = "background"
"editor.subheader.background" = "surface"
"editor.active_line.background" = { role = "foreground", opacity = 0.07 }
"editor.highlighted_line.background" = { role = "foreground", opacity = 0.03 }
"editor.line_number" = "foreground-faint"
"editor.active_line_number" = "accent-primary"
"editor.invisible" = { role = "foreground-muted", opacity = 0.4 }
"editor.wrap_guide" = "surface-light"
"editor.active_wrap_guide" = "border-strong"
"editor.document_highlight.read_background" = { role = "foreground-muted", opacity = 0.16 }
"editor.document_highlight.write_background" = { role = "foreground-muted", opacity = 0.16 }
"search.match_background" = { role = "accent-cool", opacity = 0.3 }
"search.active_match_background" = { role = "error", opacity = 0.3 }
"terminal.background" = "background"
"terminal.foreground" = "foreground"
"terminal.bright_foreground" = "foreground"
"link_text.hover" = "accent-cool"
error = "error"
"error.background" = { role = "error", opacity = 0.12 }
warning = "warning"
"warning.background" = { role = "warning", opacity = 0.12 }
info = "accent-cool"
"info.background" = { role = "accent-cool", opacity = 0.2 }
success = "success"
"success.background" = { role = "success", opacity = 0.12 }
